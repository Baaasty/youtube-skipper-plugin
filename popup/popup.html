<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>YouTube Skipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <span class="brand">⏭ YouTube Skipper</span>
    <nav class="tabs">
      <button class="tab active" data-tab="search" data-i18n="tab_search">Suche</button>
      <button class="tab" data-tab="settings" data-i18n="tab_settings">Einstellungen</button>
    </nav>
  </header>

  <section id="tab-search" class="tab-page active">
    <div id="novideo" class="empty" data-i18n="popup_no_video" hidden></div>
    <div id="video">
      <div class="videohead">
        <div id="title" class="title"></div>
        <div id="status" class="status"></div>
      </div>
      <div id="timeline" class="timeline"></div>
      <div class="chips">
        <button class="chip" data-jump="intro" data-i18n="jump_intro">⏩ Intro</button>
        <button class="chip" data-jump="sponsor" data-i18n="jump_sponsor">💰 Sponsor</button>
        <button class="chip" data-jump="conclusion" data-i18n="jump_conclusion">🎯 Fazit</button>
        <button class="chip" id="analyze">✨ Analyse</button>
      </div>
      <div class="search">
        <input id="query" type="text" data-i18n-placeholder="bar_placeholder">
        <button id="searchLocal" class="chip" data-i18n-title="tip_local_search">🔍</button>
        <button id="askAI" class="chip primary" data-i18n="btn_ask" data-i18n-title="tip_ask">KI fragen</button>
      </div>
      <div id="chat" class="chat"></div>
      <div id="extras"></div>
      <div id="stats" class="stats"></div>
      <div id="keyWarn" class="warn" data-i18n="popup_key_warn" hidden></div>
    </div>
  </section>

  <section id="tab-settings" class="tab-page">
    <iframe id="settingsFrame" src="../options/options.html?embed=1" data-i18n-title="tab_settings"></iframe>
  </section>

  <script src="../content/lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
